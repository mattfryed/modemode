<!DOCTYPE html>
<html lang="en" data-mm-page="about">
<head>
<meta charset="UTF-8">
<script src="assets/mm-routes.js"></script>
<script src="assets/mm-about-motion.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>About — MODE MODE</title>
<script src="assets/mm-analytics.js"></script>
<style>
  @font-face{font-family:'BB Strata Pro';src:url('assets/fonts/BBStrataProSEF-Bold.woff2') format('woff2'),
    url('assets/fonts/BBStrataProSEF-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap;}
  @font-face{font-family:'BB Strata ML';src:url('assets/fonts/BBStrata-MLRegular.woff2') format('woff2'),
    url('assets/fonts/BBStrata-MLRegular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap;}
  :root{
    color-scheme:light;
    --ground:#f5f5f2; --paper:#fbfbf9; --ink:#15140f; --grey:#7e7d75; --grey-2:#b6b5ad;
    --hair:rgba(18,16,12,.17); --hair-2:rgba(18,16,12,.08); --accent:#c40021;
    --disp:'BB Strata Pro','Arial Narrow',sans-serif;
    --text:'BB Strata ML',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);}
  body{overflow:hidden;font-family:var(--text);font-size:14px;line-height:1.66;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}

  .corner{position:fixed;width:14px;height:14px;border:1px solid var(--grey-2);pointer-events:none;opacity:.5;z-index:60;}
  .corner.tl{top:18px;left:18px;border-right:0;border-bottom:0;}
  .corner.tr{top:18px;right:18px;border-left:0;border-bottom:0;}
  .corner.bl{bottom:18px;left:18px;border-right:0;border-top:0;}
  .corner.br{bottom:18px;right:18px;border-left:0;border-top:0;}
  /* Shared wordmark anchor across index / project / about — equidistant top
     and left. Width still varies per page. */
  .wordmark{position:fixed;top:40px;left:40px;width:94px;z-index:60;opacity:.92;transition:opacity .15s;}
  .wordmark:hover{opacity:.6;} .wordmark img{display:block;width:94px;height:auto;}
  .home{position:fixed;top:44px;right:40px;z-index:60;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);display:inline-flex;align-items:center;gap:8px;}
  .home:hover{color:var(--ink);} .home svg{display:block;}

  .plate{position:fixed;inset:18px;border:1px solid var(--hair);display:grid;grid-template-columns:400px minmax(0,1fr);background:var(--paper);}
  /* Notes column — kicker · lede · body · meta, then the site index at the
     very bottom (single hierarchical column: local copy above, global nav
     below). Matt's original type scale unchanged; meta pins to the bottom
     of #copy so it sits directly above the index divider. */
  .notes{border-right:1px solid var(--hair);padding:96px 36px 34px;display:flex;flex-direction:column;min-width:0;background:rgba(251,251,249,.97);z-index:3;overflow-y:auto;overscroll-behavior:contain;}
  .notes #copy{display:flex;flex-direction:column;flex:1 0 auto;}
  .notes .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:0 0 26px;}
  .notes .lede{font-family:var(--disp);font-weight:700;font-size:clamp(28px,2.5vw,38px);line-height:1.07;letter-spacing:-.012em;max-width:14ch;margin:0 0 26px;}
  .notes .body{font-size:14px;line-height:1.66;max-width:40ch;}
  .notes .body p{margin:0 0 14px;} .notes .body p:last-child{margin:0;}
  .notes .meta{margin-top:auto;padding-top:24px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);line-height:1.8;}
  .notes #site-index{flex:0 0 auto;}

  .figure{position:relative;min-width:0;overflow:hidden;background:var(--ground);isolation:isolate;}
  .cvwrap{position:absolute;inset:0;}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:0;}
  #cv.dragging{cursor:grabbing;}
  .shell-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;pointer-events:none;z-index:1;shape-rendering:geometricPrecision;}
  .shell-svg path{fill:none;stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;}
  .glfail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:40px;text-align:center;color:var(--grey);font-size:11px;letter-spacing:.13em;text-transform:uppercase;}

  @media (max-width:960px){
    body{overflow:auto;}
    .plate{position:relative;inset:auto;margin:14px;grid-template-columns:1fr;min-height:calc(100vh - 28px);}
    .notes{border-right:0;border-bottom:1px solid var(--hair);padding:100px 22px 34px;overflow:visible;}
    .figure{height:64vh;min-height:400px;}
    .corner{display:none;}
    .home{right:22px;}
  }
  @media (max-width:620px){
    .figure{height:58vh;min-height:340px;}
    .wordmark{width:78px;top:24px;left:24px;} .wordmark img{width:78px;}
    .home{top:28px;right:24px;}
  }
  #copy .contact{font-size:13px;line-height:1.6;margin:24px 0;}
  #copy .contact a{color:var(--ink);text-underline-offset:4px;}
</style>

<body>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

    <svg viewBox="0 0 22 12" width="22" height="12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="square"><path d="M2 6 H22 M16.5 0.5 L22 6 L16.5 11.5"/></svg>

<main class="plate">

    <div id="site-index"></div>

  </section>
</main>

<script>
(() => {
  'use strict';
  /* -------------------------------------------------------------------------
     CONSTRUCT
     The outside and the inside remain distinct fields, but now share a hidden
     six-node discipline-driver system:
       • the shell volume is implicit, while a sampled six-face lattice lies exactly on
         its zero-surface and is drawn as resolution-independent SVG vector linework;
       • the colored matter is a tunable population of varied metaballs carried by
         six abstract discipline drivers;
       • the same drivers can press gently into the shell, with adjustable influence
         and elastic lag. At zero influence the two systems separate completely.
     The boundary cube stays mathematically exact at rest; responsiveness is
     introduced only as that condition gives way to the other forms.
     ------------------------------------------------------------------------- */

  const DEFAULT_CONFIG={
    version:3,
    disciplines:[
      {id:'spatial',label:'Spatial',edge:'#DDDAFC',core:'#D70359'},
      {id:'digital',label:'Digital',edge:'#8BFFCC',core:'#1E6FE0'},
      {id:'physical',label:'Physical',edge:'#FECDC2',core:'#F9F90B'},
      {id:'visual',label:'Visual',edge:'#D4FFC0',core:'#00A7FF'},
      {id:'experiential',label:'Experiential',edge:'#FFD233',core:'#C40021'},
      {id:'play',label:'Play',edge:'#7FFFEB',core:'#88D420'}
    ],
    states:[
      {id:'boundary',label:'Boundary',count:12,meanSize:.102,sizeRange:.66},
      {id:'cell',label:'Cell',count:15,meanSize:.091,sizeRange:.82},
      {id:'interface',label:'Interface',count:14,meanSize:.095,sizeRange:.74},
      {id:'fold',label:'Fold',count:16,meanSize:.087,sizeRange:.90}
    ],
    motion:{cloud:0,softness:.24,drift:.68,spread:1.00,coupling:.24,lag:.32,rotationSpeed:1.00,restSeconds:7.2,transitionSpeed:1.00}
  };
  const STORAGE_KEY='mm-edge-condition-authoring-v3';
  const LEGACY_STORAGE_KEY='mm-edge-condition-authoring-v2';
  const clone=o=>JSON.parse(JSON.stringify(o));
  const validHex=s=>typeof s==='string'&&/^#[0-9a-f]{6}$/i.test(s);
  function clampNum(v,a,b,f){v=Number(v);return Number.isFinite(v)?Math.max(a,Math.min(b,v)):f;}
  function normalizeConfig(raw){
    const out=clone(DEFAULT_CONFIG);
    if(raw&&Array.isArray(raw.disciplines))out.disciplines=out.disciplines.map((d,i)=>{
      const q=raw.disciplines[i]||{};
      return {...d,
        label:typeof q.label==='string'&&q.label.trim()?q.label.trim().slice(0,28):d.label,
        edge:validHex(q.edge)?q.edge.toUpperCase():d.edge,
        core:validHex(q.core)?q.core.toUpperCase():d.core};
    });
    if(raw&&Array.isArray(raw.states))out.states=out.states.map((s,i)=>{
      const q=raw.states[i]||{};
      return {...s,
        count:Math.round(clampNum(q.count,4,16,s.count)),
        meanSize:clampNum(q.meanSize,.045,.145,s.meanSize),
        sizeRange:clampNum(q.sizeRange,0,1,s.sizeRange)};
    });
    if(raw&&raw.motion){
      const q=raw.motion;
      out.motion={
        cloud:clampNum(q.cloud,0,1,out.motion.cloud),
        softness:clampNum(q.softness,0,1,out.motion.softness),
        drift:clampNum(q.drift,0,1,out.motion.drift),
        spread:clampNum(q.spread,0,1.8,out.motion.spread),
        coupling:clampNum(q.coupling,0,1,out.motion.coupling),
        lag:clampNum(q.lag,0,1,out.motion.lag),
        rotationSpeed:clampNum(q.rotationSpeed,0,2.5,out.motion.rotationSpeed),
        restSeconds:clampNum(q.restSeconds,1,30,out.motion.restSeconds),
        transitionSpeed:clampNum(q.transitionSpeed,.25,2.5,out.motion.transitionSpeed)
      };
    }
    return out;
  }
  let config=clone(DEFAULT_CONFIG);
  try{
    const saved=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(LEGACY_STORAGE_KEY);
    if(saved)config=normalizeConfig(JSON.parse(saved));
  }catch(_){}
  let data=config.disciplines;
  const M = window.MMA || null;

  /* ── inline edit (the editor's Canvas tab): gated behind ?edit, exactly like
     project.html — edAttr()/data-edit produce nothing unless ?edit, so the
     live view renders byte-identically. ── */
  const EDIT = /(?:^|[?&])edit(?:=|&|$)/.test(location.search);

  /* Copy loader — matches the site's project pages: prefer a Supabase-authored
     doc (row slug='about'), then a bundled JSON, then a minimal inline default.
     Renders kicker · lede · sections[] · studio (people) · contact into the
     notes column. Also merges any authored `figure` block into the runtime
     config below, so palette/states/motion are CMS-editable per Supabase row. */
  const SUPABASE_URL='https://vjvjparfulrtsxdslrpg.supabase.co';
  const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqdmpwYXJmdWxydHN4ZHNscnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2ODM1ODIsImV4cCI6MjA5ODI1OTU4Mn0._A1WCuNyCtnJ2Y3U4iqWjvWQe2ANTA6i-sYfuhhcFq4';
  // Matt's copy from the authoring file, verbatim. kicker · lede · body ·
  // meta. Body + meta are single strings; blank-line splits paragraphs in
  // the body, single-newline splits lines in the meta.
  const DEFAULT_COPY={
    kicker:'MODE MODE — ABOUT',
    lede:'Strange and beautiful things emerge where disciplines lose their edges.',
    body:'MODE MODE is a studio working between creative technology, experiential design, fabrication, visual systems, art, and play.\n\nThe figure at right is not a map of those disciplines. It is a container whose definition keeps changing while the material inside finds new relationships.',
    meta:'BROOKLYN, NEW YORK\nINDEPENDENT / COLLABORATIVE / VARIABLE'
  };
  const escHTML=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const paras=t=>String(t||'').split(/\x0a{2,}/).map(p=>`<p>${escHTML(p).replace(/\x0a/g,'<br>')}</p>`).join('');
  const lines=t=>String(t||'').split(/\x0a+/).map(l=>escHTML(l)).join('<br>');
  // data-edit path is only ever added when EDIT — the public page's markup
  // (and its innerHTML) stays byte-identical to before.
  function renderCopy(a){
    const host=document.getElementById('copy'); if(!host) return;
    a=a||{};
    const ea=p=>EDIT?` data-edit="${p}"`:'';
    // In EDIT mode every field renders (even empty) so an empty kicker/lede/
    // meta is still there to click into; the public page keeps its original
    // "only render if real" behavior untouched.
    const kicker=(EDIT||a.kicker)?`<div class="kicker"${ea('kicker')}>${escHTML(a.kicker||'')}</div>`:'';
    const lede=(EDIT||a.lede)?`<h1 class="lede"${ea('lede')}>${escHTML(a.lede||'')}</h1>`:'';
    const body=(EDIT||a.body)?`<div class="body"${ea('body')}>${paras(a.body||'')}</div>`:'';
    const meta=(EDIT||a.meta)?`<div class="meta"${ea('meta')}>${lines(a.meta||'')}</div>`:'';
    const contact='<p class="contact"><a href="mailto:matt@modemode.studio">Get in touch — matt@modemode.studio</a></p>';
    host.innerHTML=kicker+lede+body+contact+meta;
  }
  async function loadAboutDoc(){
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/projects?slug=eq.about&select=data`,
        {headers:{apikey:SUPABASE_ANON,Authorization:`Bearer ${SUPABASE_ANON}`},cache:'no-cache'});
      if(r.ok){ const rows=await r.json(); if(rows.length&&rows[0].data) return rows[0].data; }
    }catch(_){}
    try{ const r=await fetch('content/about.json',{cache:'no-cache'}); if(r.ok) return await r.json(); }catch(_){}
    return DEFAULT_COPY;
  }
  // Paint the default copy immediately so nothing flashes empty, then swap.
  renderCopy(DEFAULT_COPY);
  let pendingFigure=null;
  /* ── canvas doc state (edit only) — mirrors project.html's DOC/postDoc. ── */
  let DOC=null,_postT=null,_gotDoc=false;
  function postDoc(){ clearTimeout(_postT); _postT=setTimeout(()=>{ try{ parent.postMessage({type:'mm-edit-doc',doc:DOC},'*'); }catch(e){} },200); }
  function renderDoc(doc){
    DOC=doc;
    renderCopy(doc);
    pendingFigure=(doc&&doc.figure)||null;
    applyFigureConfig();
    if(EDIT){ enableInlineEdit(); mountTunePanel(); refreshTunePanel(); }
  }
  if(EDIT){
    // Same pattern as project.html: announce readiness, let the parent editor
    // push its (possibly unsaved) state.doc via mm-edit-load, and only fall
    // back to loading straight from Supabase/JSON if the parent never answers
    // (e.g. the page opened directly with ?edit, outside the CMS).
    try{ parent.postMessage({type:'mm-edit-ready',slug:'about'},'*'); }catch(_){}
    setTimeout(()=>{ if(!_gotDoc){ loadAboutDoc().then(doc=>{ if(!_gotDoc){ _gotDoc=true; renderDoc(doc); } }).catch(()=>{}); } },700);
  } else {
    loadAboutDoc().then(doc=>renderDoc(doc)).catch(()=>{});
  }

  let focus=-1,focusTarget=-1; // discipline focus retained for the shader; no legend renders now
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  const canvas=document.getElementById('cv');
  const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false,powerPreference:'high-performance'});
  if(!gl){ document.getElementById('glfail').style.display='flex'; canvas.style.display='none'; return; }

  const VERT=`#version 300 es
  in vec2 aPosition;
  out vec2 vUv;
  void main(){vUv=aPosition*.5+.5;gl_Position=vec4(aPosition,0.,1.);}`;

  const FRAG=`#version 300 es
  precision highp float;
  precision highp int;
  #define BALLS 96
  #define DRIVERS 6
  #define BPG 16
  #define PI 3.141592653589793
  uniform vec2 uResolution;
  uniform float uTime;
  uniform float uMorph;
  uniform int uShapeA;
  uniform int uShapeB;
  uniform float uYaw;
  uniform float uPitch;
  uniform float uRoll;
  uniform float uFocus;
  uniform float uCloudiness;
  uniform float uSoftness;
  uniform float uActivity;
  uniform float uSpread;
  uniform float uCoupling;
  uniform vec3 uMatterA;
  uniform vec3 uMatterB;
  uniform vec4 uBalls[BALLS];
  uniform vec4 uMatterDrivers[DRIVERS];
  uniform vec4 uShellDrivers[DRIVERS];
  uniform vec3 uCore[DRIVERS];
  uniform vec3 uEdge[DRIVERS];
  out vec4 fragColor;

  mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
  float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
  float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
  float sdRoundBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
  float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}

  float boundary(vec3 p){
    return sdBox(p,vec3(.58));
  }
  float cell(vec3 p){
    float d=length(p)-.60;
    d=smin(d,length(p-vec3(.42,.22,.10))-.43,.25);
    d=smin(d,length(p-vec3(-.38,-.27,.18))-.41,.24);
    d=smin(d,length(p-vec3(.02,.36,-.38))-.43,.25);
    d=smin(d,length(p-vec3(-.13,.02,.46))-.35,.22);
    return d;
  }
  float interfaceForm(vec3 p){
    vec3 q=p;
    q.xz=r2(.10)*q.xz;
    float dx=sdCapsule(q,vec3(-.54,0.,0.),vec3(.54,0.,0.),.39);
    float dy=sdCapsule(q,vec3(0.,-.52,0.),vec3(0.,.52,0.),.39);
    float dz=sdCapsule(q,vec3(0.,0.,-.52),vec3(0.,0.,.52),.39);
    float d=smin(smin(dx,dy,.24),dz,.24);
    return smin(d,length(q)-.58,.20);
  }
  float foldForm(vec3 p){
    vec3 q=p;
    q.xz=r2(.83*q.y+.12)*q.xz;
    q.xy=r2(-.46*q.z)*q.xy;
    q+=.052*sin(q.yzx*4.1+vec3(0.,2.1,4.2));
    float d=sdRoundBox(q,vec3(.43,.61,.47),.235);
    d=smin(d,length(q-vec3(.34,.23,.13))-.34,.18);
    d=smin(d,length(q+vec3(.31,.18,.24))-.32,.18);
    return d;
  }
  float form(vec3 p,int id){
    if(id==0)return boundary(p);
    if(id==1)return cell(p);
    if(id==2)return interfaceForm(p);
    return foldForm(p);
  }
  float responseFor(int id){
    if(id==0)return 0.;
    if(id==1)return 1.00;
    if(id==2)return .88;
    return .78;
  }
  float driverPressure(vec3 p){
    float f=0.;
    for(int i=0;i<DRIVERS;i++){
      vec4 d=uShellDrivers[i];
      vec3 q=p-d.xyz;
      float x=clamp(1.-dot(q,q)/(d.w*d.w),0.,1.);
      f+=x*x*(3.-2.*x);
    }
    return min(f,1.55);
  }
  float scene(vec3 p){
    float d=mix(form(p,uShapeA),form(p,uShapeB),uMorph);
    d-=.035*sin(PI*uMorph);
    float response=mix(responseFor(uShapeA),responseFor(uShapeB),uMorph);
    if(response>.0001&&uCoupling>.001)d-=uCoupling*response*.085*(driverPressure(p)-.065);
    return d;
  }
  vec3 normalAt(vec3 p){
    float e=.0026;
    return normalize(vec3(scene(p+vec3(e,0,0))-scene(p-vec3(e,0,0)),scene(p+vec3(0,e,0))-scene(p-vec3(0,e,0)),scene(p+vec3(0,0,e))-scene(p-vec3(0,0,e))));
  }
  vec2 raySphere(vec3 ro,vec3 rd,float r){
    float b=dot(ro,rd),c=dot(ro,ro)-r*r,h=b*b-c;
    if(h<0.)return vec2(-1.);
    h=sqrt(h);return vec2(-b-h,-b+h);
  }
  float refineRoot(vec3 ro,vec3 rd,float ta,float tb,float da){
    float a=ta,b=tb,sa=da;
    for(int j=0;j<8;j++){
      float m=(a+b)*.5,sm=scene(ro+rd*m);
      if((sa<0.)==(sm<0.)){a=m;sa=sm;}else b=m;
    }
    return (a+b)*.5;
  }
  bool shellHit(vec3 ro,vec3 rd,out float tin,out float tout,out vec3 nin,out vec3 nout){
    vec2 bs=raySphere(ro,rd,1.34);if(bs.x<0.)return false;
    float t=max(bs.x,0.),end=bs.y;
    float d=scene(ro+rd*t);
    bool inside=d<0.,haveIn=inside,haveOut=false;
    if(inside){tin=t;nin=normalAt(ro+rd*t);}
    for(int i=0;i<148;i++){
      if(t>=end)break;
      float stepLen=clamp(abs(d)*.43+.0025,.0025,.058);
      float nt=min(end,t+stepLen),nd=scene(ro+rd*nt);
      if(!inside && d>=0. && nd<0.){
        float hit=refineRoot(ro,rd,t,nt,d);
        if(!haveIn){tin=hit;nin=normalAt(ro+rd*hit);haveIn=true;}
        inside=true;
      }else if(inside && d<=0. && nd>0.){
        float hit=refineRoot(ro,rd,t,nt,d);
        tout=hit;nout=normalAt(ro+rd*hit);haveOut=true;inside=false;
        // Keep scanning. A non-convex vessel can have several interior spans;
        // transparent matter uses the first entry and final exit so a nearer
        // lobe never falsely erases color contained in a farther lobe.
      }
      t=nt;d=nd;
    }
    return haveIn&&haveOut&&tout-tin>.0015;
  }
  float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}

  void main(){
    vec2 sp=(gl_FragCoord.xy*2.-uResolution.xy)/uResolution.y;

    const n=params.has(key)?Number(params.get(key)):Number(fallback);
    return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback;
  };
  const pct=v=>String(Math.round(v*100)).padStart(2,'0')+'%';
  const spreadText=v=>Math.round(v*100)+'%';
  const lagText=v=>(v*3.2).toFixed(1)+'s';
  const rotationText=v=>v<.005?'still':v.toFixed(2)+'×';
  const secondsText=v=>Number(v).toFixed(1)+'s';
  const transitionText=v=>v.toFixed(2)+'× · '+(5.2/v).toFixed(1)+'s';
  let cloud=readParam('cloud',config.motion.cloud);
  let softness=readParam('soft',config.motion.softness);
  let activity=readParam('drift',config.motion.drift);
  let spread=readParam('spread',config.motion.spread,0,1.8);
  let coupling=readParam('couple',config.motion.coupling);
  let lag=readParam('lag',config.motion.lag);
  let rotationSpeed=readParam('rotate',config.motion.rotationSpeed,0,2.5);
  let restSeconds=readParam('rest',config.motion.restSeconds,1,30);
  let transitionSpeed=readParam('transition',config.motion.transitionSpeed,.25,2.5);
  Object.assign(config.motion,{cloud,softness,drift:activity,spread,coupling,lag,rotationSpeed,restSeconds,transitionSpeed});

  const stage=document.getElementById('stage');
  // saveConfig() is a no-op on the public page — no localStorage authoring cache.
  function saveConfig(){}
  // applyFigureConfig() lets the CMS-authored `figure` block override defaults
  // once the Supabase doc has loaded. Called after loadAboutDoc() resolves.
  function applyFigureConfig(){
    if(!pendingFigure) return;
    const cfg=normalizeConfig(Object.assign({}, DEFAULT_CONFIG, pendingFigure));
    // Merge into the live config (palette + states + motion).
    config.disciplines=cfg.disciplines; data=config.disciplines;
    config.states=cfg.states;
    Object.assign(config.motion,cfg.motion);
    cloud=config.motion.cloud;
    softness=config.motion.softness;
    activity=config.motion.drift;
    spread=config.motion.spread;
    coupling=config.motion.coupling;
    lag=config.motion.lag;
    rotationSpeed=config.motion.rotationSpeed;
    restSeconds=config.motion.restSeconds;
    transitionSpeed=config.motion.transitionSpeed;
    colorDirty=true;
  }

  /* ── edit-mode chrome (canvas only) ───────────────────────────────────────
     Inline contentEditable on the notes-column copy, plus Matt's Tune panel
     (palette / states / motion) reintroduced behind ?edit so the editor's
     Canvas tab can drive the same figure config the Form tab's sliders write
     to data.figure. Every control here writes into DOC (the doc handed down
     by mm-edit-load / loadAboutDoc) and calls postDoc() — same contract as
     project.html's inline edit + page builder. */
  function ensureEditStyle(){
    if(document.getElementById('mm-ed-style'))return;
    const st=document.createElement('style'); st.id='mm-ed-style';
    st.textContent=
       '.mm-ed{outline:1px dashed transparent;outline-offset:3px;border-radius:2px;transition:outline-color .12s,background .12s;cursor:text;}'
      +'.mm-ed:hover{outline-color:rgba(196,0,33,.4);}'
      +'.mm-ed:focus{outline:1px solid var(--accent,#c40021);background:rgba(196,0,33,.05);}'
      +'#mm-tune-toggle{position:fixed;right:12px;bottom:8px;z-index:200;font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);background:var(--paper);border:1px solid var(--hair);border-radius:6px;padding:8px 12px;cursor:pointer;box-shadow:0 3px 12px rgba(18,16,12,.18);}'
      +'#mm-tune-toggle:hover{color:var(--ink);}'
      +'#mm-tune-toggle.on{color:var(--accent);border-color:rgba(196,0,33,.4);}'
      +'.mm-tune-panel{position:fixed;right:12px;bottom:44px;z-index:199;width:296px;max-height:66vh;overflow-y:auto;background:rgba(251,251,249,.98);border:1px solid var(--hair);border-radius:8px;box-shadow:0 12px 32px rgba(18,16,12,.24);padding:14px;font-size:11px;color:var(--ink);display:none;}'
      +'.mm-tune-panel.open{display:block;}'
      +'.mm-tune-sec{margin:0 0 16px;}'
      +'.mm-tune-sec:last-child{margin-bottom:0;}'
      +'.mm-tune-sec h4{margin:0 0 8px;font:9.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);}'
      +'.mm-tune-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}'
      +'.mm-tune-row input[type=text]{flex:1;min-width:0;font:inherit;border:1px solid var(--hair);border-radius:4px;padding:3px 6px;background:var(--paper);color:var(--ink);}'
      +'.mm-tune-row input[type=color]{width:22px;height:22px;padding:0;border:1px solid var(--hair);border-radius:4px;background:none;cursor:pointer;}'
      +'.mm-tune-grad{display:block;width:34px;height:14px;border-radius:3px;border:1px solid var(--hair);flex:0 0 auto;}'
      +'.mm-tune-state{border-top:1px solid var(--hair-2);padding-top:8px;margin-top:8px;}'
      +'.mm-tune-state:first-of-type{border-top:0;padding-top:0;margin-top:0;}'
      +'.mm-tune-sname{display:flex;align-items:center;gap:6px;margin-bottom:4px;}'
      +'.mm-tune-sname b{font:9px/1 ui-monospace,monospace;letter-spacing:.1em;color:var(--grey-2);white-space:nowrap;}'
      +'.mm-tune-sname input{flex:1;min-width:0;font:inherit;border:1px solid var(--hair);border-radius:4px;padding:2px 5px;background:var(--paper);color:var(--ink);}'
      +'.mm-tune-slider{margin-bottom:6px;}'
      +'.mm-tune-slider .mm-tl{display:flex;justify-content:space-between;font-size:10px;color:var(--grey);margin-bottom:2px;}'
      +'.mm-tune-slider input[type=range]{width:100%;}';
    document.head.appendChild(st);
  }
  function enableInlineEdit(){
    ensureEditStyle();
    document.querySelectorAll('#copy [data-edit]').forEach(node=>{
      if(node._mmEd)return; node._mmEd=true;
      node.setAttribute('contenteditable','true'); node.classList.add('mm-ed'); node.spellcheck=false;
      const path=node.getAttribute('data-edit');
      const multiline=(path==='body'||path==='meta');
      node.addEventListener('input',()=>{
        const val=multiline
          ? node.innerText.replace(/ /g,' ').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+\n/g,'\n').trim()
          : node.textContent.replace(/\s+/g,' ').trim();
        if(!DOC)return; DOC[path]=val; postDoc();
      });
      node.addEventListener('keydown',e=>{ if(!multiline&&e.key==='Enter'){ e.preventDefault(); node.blur(); } });
      node.addEventListener('paste',e=>{ e.preventDefault(); const t=((e.clipboardData||window.clipboardData).getData('text')||''); document.execCommand('insertText',false,t); });
    });
  }
  // ensureFigureDoc() normalizes + backfills DOC.figure in place — same intent
  // as the editor's ensureFigure(), reusing this file's own normalizeConfig().
  // Only called from a tune*() write, so opening the panel never marks the
  // doc dirty on its own — currentFigureView() is the non-mutating read used
  // to populate the panel's initial slider positions.
  function ensureFigureDoc(){ if(!DOC)return null; DOC.figure=normalizeConfig(DOC.figure||{}); return DOC.figure; }
  function currentFigureView(){ return normalizeConfig((DOC&&DOC.figure)||{}); }
  function tuneDiscipline(i,key,val){ const fig=ensureFigureDoc(); if(!fig)return; fig.disciplines[i][key]=val; pendingFigure=fig; applyFigureConfig(); postDoc(); }
  function tuneState(i,key,val){ const fig=ensureFigureDoc(); if(!fig)return; fig.states[i][key]=val; pendingFigure=fig; applyFigureConfig(); postDoc(); }
  function tuneMotion(key,val){ const fig=ensureFigureDoc(); if(!fig)return; fig.motion[key]=val; pendingFigure=fig; applyFigureConfig(); postDoc(); }
  function tuneSlider(container,label,val,min,max,step,onChange,fmt){
    const row=document.createElement('div'); row.className='mm-tune-slider';
    const top=document.createElement('div'); top.className='mm-tl';
    const l=document.createElement('span'); l.textContent=label;
    const out=document.createElement('span'); out.textContent=fmt(val);
    top.appendChild(l); top.appendChild(out); row.appendChild(top);
    const inp=document.createElement('input'); inp.type='range'; inp.min=String(min); inp.max=String(max); inp.step=String(step); inp.value=String(val);
    inp.oninput=()=>{ const v=+inp.value; out.textContent=fmt(v); onChange(v); };
    row.appendChild(inp); container.appendChild(row); return row;
  }
  function mountTunePanel(){
    if(document.getElementById('mm-tune-panel'))return;
    ensureEditStyle();
    const panel=document.createElement('div'); panel.id='mm-tune-panel'; panel.className='mm-tune-panel'; panel.setAttribute('contenteditable','false');
    document.body.appendChild(panel);
    const tb=document.createElement('button'); tb.id='mm-tune-toggle'; tb.type='button'; tb.textContent='Tune ▴';
    tb.setAttribute('contenteditable','false');
    tb.onclick=()=>{ const open=panel.classList.toggle('open'); tb.classList.toggle('on',open); tb.textContent=open?'Tune ▾':'Tune ▴'; };
    document.body.appendChild(tb);
  }
  function refreshTunePanel(){
    const panel=document.getElementById('mm-tune-panel'); if(!panel)return;
    const fig=currentFigureView();
    panel.innerHTML='';

    const pal=document.createElement('div'); pal.className='mm-tune-sec';
    pal.appendChild(Object.assign(document.createElement('h4'),{textContent:'Palette'}));
    fig.disciplines.forEach((d,i)=>{
      const row=document.createElement('div'); row.className='mm-tune-row';
      const nm=document.createElement('input'); nm.type='text'; nm.value=d.label; nm.maxLength=28;
      nm.oninput=()=>tuneDiscipline(i,'label',nm.value.trim()||DEFAULT_CONFIG.disciplines[i].label);
      const grad=document.createElement('span'); grad.className='mm-tune-grad'; grad.style.background=`linear-gradient(90deg,${d.edge},${d.core})`;
      const edge=document.createElement('input'); edge.type='color'; edge.value=d.edge.toLowerCase();
      const core=document.createElement('input'); core.type='color'; core.value=d.core.toLowerCase();
      edge.oninput=()=>{ tuneDiscipline(i,'edge',edge.value.toUpperCase()); grad.style.background=`linear-gradient(90deg,${edge.value},${core.value})`; };
      core.oninput=()=>{ tuneDiscipline(i,'core',core.value.toUpperCase()); grad.style.background=`linear-gradient(90deg,${edge.value},${core.value})`; };
      row.appendChild(nm); row.appendChild(edge); row.appendChild(core); row.appendChild(grad);
      pal.appendChild(row);
    });
    panel.appendChild(pal);

    const stSec=document.createElement('div'); stSec.className='mm-tune-sec';
    stSec.appendChild(Object.assign(document.createElement('h4'),{textContent:'States'}));
    fig.states.forEach((s,i)=>{
      const card=document.createElement('div'); card.className='mm-tune-state';
      const head=document.createElement('div'); head.className='mm-tune-sname';
      const tag=document.createElement('b'); tag.textContent='0'+(i+1);
      const nm=document.createElement('input'); nm.type='text'; nm.value=s.label; nm.maxLength=20;
      nm.oninput=()=>tuneState(i,'label',nm.value.trim()||DEFAULT_CONFIG.states[i].label);
      head.appendChild(tag); head.appendChild(nm); card.appendChild(head);
      tuneSlider(card,'Bodies',s.count,4,16,1,v=>tuneState(i,'count',Math.round(v)),v=>String(Math.round(v)));
      tuneSlider(card,'Mean radius',s.meanSize,.045,.145,.001,v=>tuneState(i,'meanSize',v),v=>Number(v).toFixed(3));
      tuneSlider(card,'Size spread',s.sizeRange,0,1,.01,v=>tuneState(i,'sizeRange',v),v=>Math.round(v*100)+'%');
      stSec.appendChild(card);
    });
    panel.appendChild(stSec);

    const mo=document.createElement('div'); mo.className='mm-tune-sec';
    mo.appendChild(Object.assign(document.createElement('h4'),{textContent:'Motion'}));
    const m=fig.motion;
    tuneSlider(mo,'Cloudiness',m.cloud,0,1,.01,v=>tuneMotion('cloud',v),v=>Math.round(v*100)+'%');
    tuneSlider(mo,'Softness',m.softness,0,1,.01,v=>tuneMotion('softness',v),v=>Math.round(v*100)+'%');
    tuneSlider(mo,'Drift',m.drift,0,1,.01,v=>tuneMotion('drift',v),v=>Math.round(v*100)+'%');
    tuneSlider(mo,'Cluster spread',m.spread,0,1.8,.01,v=>tuneMotion('spread',v),v=>Math.round(v*100)+'%');
    tuneSlider(mo,'Matter → shell',m.coupling,0,1,.01,v=>tuneMotion('coupling',v),v=>Math.round(v*100)+'%');
    tuneSlider(mo,'Shell lag',m.lag,0,1,.01,v=>tuneMotion('lag',v),v=>(v*3.2).toFixed(1)+'s');
    tuneSlider(mo,'Rotation speed',m.rotationSpeed,0,2.5,.01,v=>tuneMotion('rotationSpeed',v),v=>v<.005?'still':v.toFixed(2)+'×');
    tuneSlider(mo,'State length',m.restSeconds,1,30,.1,v=>tuneMotion('restSeconds',v),v=>Number(v).toFixed(1)+'s');
    tuneSlider(mo,'Transition speed',m.transitionSpeed,.25,2.5,.01,v=>tuneMotion('transitionSpeed',v),v=>v.toFixed(2)+'×');
    panel.appendChild(mo);
  }

  let initial=Math.max(0,Math.min(NAMES.length-1,Number(params.get('form'))||0));
  let a=initial,b=initial,morph=0,transitioning=false,tStart=0,lastRest=performance.now(),manualUntil=0;
  const forcedStill=params.get('still')==='1';
  const reduced=forcedStill||matchMedia('(prefers-reduced-motion: reduce)').matches || (M&&M.reduced&&M.reduced());
  const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*t*(t*(t*6-15)+10);};
  function go(to,manual=true){
    to=(to+NAMES.length)%NAMES.length;
    if(transitioning){a=morph<.5?a:b;}
    else a=b;
    if(to===a){b=a;morph=0;transitioning=false;updateUI();return;}
    b=to;morph=0;transitioning=true;tStart=performance.now();
    if(manual)manualUntil=performance.now()+3000;
    updateUI();
  }
  function updateUI(){/* readouts + form buttons are not in the public page */}

  let yaw=Number.isFinite(Number(params.get('yaw')))?Number(params.get('yaw')):.57;
  let pitch=Number.isFinite(Number(params.get('pitch')))?Number(params.get('pitch')):-.36;
  let drag=false,px=0,py=0,moved=0;
  canvas.addEventListener('pointerdown',e=>{drag=true;moved=0;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');manualUntil=performance.now()+4000;});
  canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.006;pitch=Math.max(-1.05,Math.min(.45,pitch+dy*.005));});
  canvas.addEventListener('pointerup',e=>{if(!drag)return;drag=false;canvas.classList.remove('dragging');try{canvas.releasePointerCapture(e.pointerId);}catch(_){}if(moved<7)go((transitioning?b:a)+1,true);});
  canvas.addEventListener('pointercancel',()=>{drag=false;canvas.classList.remove('dragging');});
  addEventListener('keydown',e=>{
    // Edit mode adds real form controls (Tune panel sliders, contentEditable
    // copy) — arrow keys there must not also advance the vessel state.
    const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
    if(e.key==='ArrowRight'){go((transitioning?b:a)+1,true);e.preventDefault();}
    if(e.key==='ArrowLeft'){go((transitioning?b:a)-1,true);e.preventDefault();}
  });

  let origin=performance.now(),lastFrame=0,shellClock=0;
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden)return;
    if(now-lastFrame<1000/30)return;
    const dt=lastFrame?Math.min(.10,(now-lastFrame)/1000):1/30;lastFrame=now;
    resize();
    if(transitioning){
      const dur=reduced?1:5200/Math.max(.05,transitionSpeed),p=(now-tStart)/dur;morph=ease(p);
      if(p>=1){a=b;morph=0;transitioning=false;lastRest=now;updateUI();}
    }else if(!reduced&&now>manualUntil&&now-lastRest>restSeconds*1000)go((a+1)%NAMES.length,false);
    focus+=(focusTarget-focus)*.10;
    const t=reduced?0:(now-origin)/1000;
    updateDrivers(t,dt,reduced);
    const bodyData=bodyMotion.update({time:t,from:a,to:b,morph,activity:reduced?0:activity,spread,drivers:matterDrivers,delta:layoutDelta});
    if(!reduced)shellClock+=dt*rotationSpeed;
    const s=shellClock;
    const autoYaw=reduced?0:s*.045+.20*(Math.sin(s*.092+.4)-Math.sin(.4))+.055*(Math.sin(s*.193+1.2)-Math.sin(1.2));
    const autoPitch=reduced?0:.22*(Math.sin(s*.112+1.1)-Math.sin(1.1))+.07*(Math.sin(s*.231+.2)-Math.sin(.2));
    const autoRoll=reduced?0:.15*(Math.sin(s*.087+2.0)-Math.sin(2.0))+.055*(Math.sin(s*.179+.75)-Math.sin(.75));
    const drawYaw=yaw+autoYaw,drawPitch=Math.max(-1.28,Math.min(.72,pitch+autoPitch)),drawRoll=autoRoll;
    gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
    gl.useProgram(prog);gl.bindVertexArray(quadVAO);
    gl.uniform4fv(U['uBalls[0]'],bodyData);
    gl.uniform2f(U.uResolution,canvas.width,canvas.height);
    gl.uniform1f(U.uTime,t);gl.uniform1f(U.uMorph,morph);gl.uniform1i(U.uShapeA,a);gl.uniform1i(U.uShapeB,b);
    if(colorDirty)syncColorUniforms();
    gl.uniform1f(U.uYaw,drawYaw);gl.uniform1f(U.uPitch,drawPitch);gl.uniform1f(U.uRoll,drawRoll);gl.uniform1f(U.uFocus,focus);gl.uniform1f(U.uCloudiness,cloud);
    gl.uniform1f(U.uSoftness,softness);gl.uniform1f(U.uActivity,activity);gl.uniform1f(U.uSpread,spread);gl.uniform1f(U.uCoupling,coupling);
    const sa=config.states[a],sb=config.states[b];
    gl.uniform3f(U.uMatterA,sa.count,sa.meanSize,sa.sizeRange);
    gl.uniform3f(U.uMatterB,sb.count,sb.meanSize,sb.sizeRange);
    gl.uniform4fv(U['uMatterDrivers[0]'],matterDrivers);gl.uniform4fv(U['uShellDrivers[0]'],shellDrivers);
    gl.drawArrays(gl.TRIANGLES,0,6);
    gl.bindVertexArray(null);
    renderVectorShell(drawYaw,drawPitch,drawRoll);
  }
  // Parent editor push: it drives the canvas the same way it drives
  // project.html — mm-edit-load carries state.doc (including any unsaved
  // Form/Raw-JSON edits) whenever it's ready or the doc changes underneath.
  window.addEventListener('message',ev=>{
    const m=ev&&ev.data; if(!m||typeof m!=='object')return;
    if(m.type==='mm-edit-load'&&m.doc){ _gotDoc=true; renderDoc(m.doc); }
  });

  updateUI();requestAnimationFrame(frame);
})();
</script>
