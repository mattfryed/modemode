<body>

<div id="login">
  <div class="wm"><img class="logo" src="../assets/mode-mode-logo.svg" alt="MODE MODE"><span>STUDIO</span></div>
  <h1>Studio sign-in</h1>
  <p>Proposals &amp; invoices. Authorized accounts only.</p>
  <div class="field"><label>Email<input id="email" type="email" autocomplete="username"></label></div>
  <div class="field"><label>Password<input id="password" type="password" autocomplete="current-password"></label></div>
  <button class="btn" id="signin">Sign in</button>
  <div class="alt">First time on this device? <a href="#" id="signupLink">create account</a></div>
  <div id="loginMsg"></div>
</div>

<div id="workspace" class="hidden">
  <aside class="sidebar">
    <a class="wordmark" href="#dashboard"><img class="logo" src="../assets/mode-mode-logo.svg" alt="MODE MODE"><span>STUDIO</span></a>
    <nav aria-label="Main">
      <a href="#dashboard" data-nav="dashboard"><span>01</span> Overview</a>
      <a href="#proposals" data-nav="proposals"><span>02</span> Proposals</a>
      <a href="#invoices" data-nav="invoices"><span>03</span> Invoices</a>
      <a href="#projects" data-nav="projects"><span>04</span> Projects</a>
      <a href="#clients" data-nav="clients"><span>05</span> Clients</a>
      <a href="#settings" data-nav="settings"><span>06</span> Settings</a>
    </nav>
    <div class="sidebar-bottom">
      <span class="dot"></span> HOSTED WORKSPACE<br><small id="whoami"></small>
      <button class="sb-link" id="exportBtn" type="button">Export data (JSON) ↗</button>
      <a class="sb-link" href="../editor/">← Back end · Content editor</a>
      <button class="sb-link" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <main id="app"><p class="loading">Opening your workspace…</p></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"><form id="dialog-form" method="dialog"><div id="dialog-content"></div></form></dialog>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL='https://vjvjparfulrtsxdslrpg.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqdmpwYXJmdWxydHN4ZHNscnBnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2ODM1ODIsImV4cCI6MjA5ODI1OTU4Mn0._A1WCuNyCtnJ2Y3U4iqWjvWQe2ANTA6i-sYfuhhcFq4';
const sb = (window.__SB_STUB__ ? window.__SB_STUB__ : createClient(SB_URL, SB_ANON));

/* ================= money (from server/money.js — fixed-point) ================= */
function decimal(value, places=2, label='Amount'){
  const t=String(value ?? '').trim();
  const pattern=new RegExp('^\\d{1,9}(?:\\.\\d{1,'+places+'})?$');
  if(!pattern.test(t)) throw new Error(label+': enter a nonnegative number with at most '+places+' decimal places.');
  const [w,f='']=t.split('.');
  const n=Number(BigInt(w)*10n**BigInt(places)+BigInt(f.padEnd(places,'0')));
  if(!Number.isSafeInteger(n)) throw new Error(label+' is too large.');
  return n;
}
function formatDecimal(n,places=2){ if(!Number.isSafeInteger(n)||n<0) throw new Error('Invalid fixed-point value.'); const t=String(n).padStart(places+1,'0'); return t.slice(0,-places)+'.'+t.slice(-places); }
function lineAmount(quantity,cents){ const n=(BigInt(quantity)*BigInt(cents)+5000n)/10000n; if(n>99999999999n) throw new Error('Line total exceeds the supported limit.'); return Number(n); }
function totalItems(items,tax='0.00'){
  const lines=items.map(item=>{ const q=decimal(item.quantity,4,'Quantity'); const rateCents=decimal(item.rate,2,'Rate'); return {...item,rateCents,amountCents:lineAmount(q,rateCents)}; });
  const subtotalCents=lines.reduce((a,b)=>a+b.amountCents,0);
  const taxCents=decimal(tax,2,'Tax');
  const totalCents=subtotalCents+taxCents;
  if(!Number.isSafeInteger(totalCents)||totalCents>99999999999) throw new Error('Document total exceeds the supported limit.');
  return {lines,subtotalCents,taxCents,totalCents};
}
const usd=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100);

/* ================= validation (from server/validation.js), namespaced as V ===== */
const V=(()=>{
  const text=(v,max=4000)=>{ const s=String(v ?? '').trim(); if(s.length>max) throw new Error('Text must be at most '+max+' characters.'); return s; };
  const date=(v,optional=false)=>{ const s=text(v,10); if(!s&&optional) return ''; if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||new Date(s+'T12:00:00Z').toISOString().slice(0,10)!==s) throw new Error('Use a valid YYYY-MM-DD date.'); return s; };
  const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const client=(v)=>{ const out={name:text(v.name,180),contact:text(v.contact,180),email:text(v.email,200),address:text(v.address,1000),notes:text(v.notes)}; if(!out.name) throw new Error('Client legal / billing name is required.'); if(out.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(out.email)) throw new Error('Enter a valid client email.'); return out; };
  const project=(v)=>{ const out={name:text(v.name,200),clientId:text(v.clientId,80),reference:text(v.reference,120),notes:text(v.notes)}; if(!out.name||!out.clientId) throw new Error('A project needs a name and a client.'); return out; };
  const prefix=(v,fb)=>{ const s=(text(v,16).toUpperCase())||fb; if(!/^[A-Z0-9-]+$/.test(s)) throw new Error('Number prefixes may contain only A-Z, 0-9 and hyphens.'); return s; };
  const settings=(v)=>({ studioName:text(v.studioName,140),legalName:text(v.legalName,160),address:text(v.address,1000),email:text(v.email,200),phone:text(v.phone,100),paymentInstructions:text(v.paymentInstructions,3000),invoiceTerms:text(v.invoiceTerms,3000),proposalTerms:text(v.proposalTerms,6000),invoicePrefix:prefix(v.invoicePrefix,'MM-I'),proposalPrefix:prefix(v.proposalPrefix,'MM-P'),defaultDueDays:Math.max(0,Math.min(365,Math.round(Number(v.defaultDueDays)||0))) });
  const sectionKeys=['overview','scope','deliverables','timeline','assumptions','terms'];
  const document=(v,kind)=>{
    if(!['proposal','invoice'].includes(kind)) throw new Error('Unknown document type.');
    const items=(Array.isArray(v.items)?v.items:[]).map(i=>({ description:text(i.description,1800),quantity:String(i.quantity ?? '1').trim(),unit:text(i.unit,24),rate:formatDecimal(decimal(i.rate ?? '0',2,'Rate')),showRate:i.showRate!==false }));
    if(items.length>120) throw new Error('Use at most 120 line items.');
    if(items.some(i=>!i.description)) throw new Error('Each fee needs a description.');
    for(const i of items) if(decimal(i.quantity,4,'Quantity')<=0) throw new Error('Quantities must be greater than zero.');
    const out={ title:text(v.title,200),issueDate:date(v.issueDate),dueDate:date(v.dueDate,true),reference:text(v.reference,140),items,tax:formatDecimal(decimal(v.tax ?? '0',2,'Tax')),notes:text(v.notes,6000),terms:text(v.terms,6000),paymentInstructions:text(v.paymentInstructions,4000),internalNotes:text(v.internalNotes,6000),sections:{} };
    if(!out.title) throw new Error('Document title is required.');
    if(out.dueDate&&out.dueDate<out.issueDate) throw new Error('Due / valid-until date cannot precede the issue date.');
    for(const k of sectionKeys) out.sections[k]=text(v.sections?.[k],14000);
    totalItems(items,out.tax);
    return out;
  };
  return {text,date,today,client,project,settings,sectionKeys,document};
})();

/* ================= small helpers ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha256Hex(buf){ const h=await crypto.subtle.digest('SHA-256',buf); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function ab2b64(buf){ let s='',b=new Uint8Array(buf); const c=0x8000; for(let i=0;i<b.length;i+=c) s+=String.fromCharCode.apply(null,b.subarray(i,i+c)); return btoa(s); }

/* ================= auth ================= */
async function refreshAuth(){
  const { data:{ session } }=await sb.auth.getSession();
  const inApp=!!session;
  $('#login').classList.toggle('hidden',inApp);
  $('#workspace').classList.toggle('hidden',!inApp);
  if(inApp){ $('#whoami').textContent=session.user.email; render(); }
}
$('#signin').onclick=async()=>{ const email=$('#email').value.trim(), password=$('#password').value; $('#loginMsg').textContent='…';
  const { error }=await sb.auth.signInWithPassword({ email, password }); $('#loginMsg').textContent= error?error.message:''; if(!error) refreshAuth(); };
$('#signupLink').onclick=async e=>{ e.preventDefault(); const email=$('#email').value.trim(), password=$('#password').value;
  if(!email||!password){ $('#loginMsg').textContent='Enter an email + password first.'; return; }
  const { error }=await sb.auth.signUp({ email, password }); $('#loginMsg').textContent= error?error.message:'Account created. Confirm via email if required, then sign in.'; if(!error) refreshAuth(); };

/* ================= pdfmake: embed BB Strata, build the document ================= */
let FONT='Roboto', FONTVFS=null, FONTDEF=null, LOGO_SVG=null;
async function loadFonts(){
  try{
    const [reg,bold]=await Promise.all([
      fetch('../assets/fonts/BBStrata-MLRegular.otf').then(r=>r.arrayBuffer()),
      fetch('../assets/fonts/BBStrataProSEF-Bold.ttf').then(r=>r.arrayBuffer())
    ]);
    FONTVFS={ 'BBStrata-MLRegular.otf':ab2b64(reg), 'BBStrataProSEF-Bold.ttf':ab2b64(bold) };
    FONTDEF={ Strata:{ normal:'BBStrata-MLRegular.otf', bold:'BBStrataProSEF-Bold.ttf', italics:'BBStrata-MLRegular.otf', bolditalics:'BBStrataProSEF-Bold.ttf' } };
    FONT='Strata';
  }catch(e){ FONT='Roboto'; FONTVFS=null; FONTDEF=null; }
  try{ LOGO_SVG=(await fetch('../assets/mode-mode-logo.svg').then(r=>r.text())).replace(/<\?xml[^>]*\?>/,'').trim(); }catch(e){ LOGO_SVG=null; }
}
const prettyDate=v=>v?new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(v+'T12:00:00Z')):'—';
const INK='#171715', RULE={hLineColor:()=>INK,vLineColor:()=>INK,hLineWidth:()=>0.75,vLineWidth:()=>0.75,paddingLeft:()=>10,paddingRight:()=>10,paddingTop:()=>9,paddingBottom:()=>9};
function pdfDef(s){
  const d=s.data, company=s.company, client=s.client||{}, proposal=s.kind==='proposal';

    {columns:[

        {columns:[{text:'Currency',fontSize:8.5,color:'#555'},{text:'USD',fontSize:8.5,alignment:'right'}]}
      ]}
    ]}
  ],margin:[4,4,4,4]}]]}, layout:RULE, margin:[0,0,0,10] });
  // proposal sections before fees
  const secMap=[['overview','Overview'],['scope','Scope of work'],['deliverables','Deliverables'],['timeline','Timeline'],['assumptions','Assumptions & exclusions'],['terms','Terms & next steps']];
  const sectionBlocks=list=>list.filter(([k])=>d.sections?.[k]).map(([k,title])=>({stack:[{text:title,bold:true,fontSize:12,margin:[0,0,0,6]},{text:d.sections[k],fontSize:10,lineHeight:1.35}],margin:[0,0,0,14],unbreakable:false}));
  if(proposal) content.push(...sectionBlocks(secMap.slice(0,5)));
  // fees table
  const feeBody=[[ {text:'Item',bold:true,fontSize:8},{text:'Qty',bold:true,fontSize:8,alignment:'right'},{text:'Unit cost',bold:true,fontSize:8,alignment:'right'},{text:'Total',bold:true,fontSize:8,alignment:'right'} ]];
  if(t.lines.length) t.lines.forEach(i=>feeBody.push([
    {text:i.description+(i.showRate&&i.unit?'':''),fontSize:9},
    {text:i.showRate?(i.quantity+(i.unit?' '+i.unit:'')):'—',fontSize:9,alignment:'right'},
    {text:i.showRate?usd(i.rateCents):'—',fontSize:9,alignment:'right'},
    {text:usd(i.amountCents),fontSize:9,alignment:'right'}
  ])); else feeBody.push([{text:'No fee items yet.',colSpan:4,color:'#60605b',fontSize:8},{},{},{}]);
  content.push({ table:{widths:['*',60,66,70],headerRows:1,body:feeBody, dontBreakRows:true },
    layout:{ hLineColor:(i)=>i===1?INK:'#dededb', vLineColor:()=>'#fff', hLineWidth:(i,node)=>i===0||i===node.table.body.length||i===1?0.75:0.5, vLineWidth:()=>0, paddingLeft:()=>0, paddingRight:()=>8, paddingTop:()=>7, paddingBottom:()=>7 },
    margin:[0,2,0,0] });
  // totals (right aligned)
  const totalsRows=[[{text:'Subtotal',fontSize:9},{text:usd(t.subtotalCents),fontSize:9,alignment:'right'}]];
  if(t.taxCents) totalsRows.push([{text:'Tax',fontSize:9},{text:usd(t.taxCents),fontSize:9,alignment:'right'}]);
  totalsRows.push([{text:proposal?'Proposed total':'Invoice total',bold:true,fontSize:12},{text:usd(t.totalCents),bold:true,fontSize:12,alignment:'right'}]);
  content.push({ columns:[{width:'*',text:''},{width:230,table:{widths:['*','auto'],body:totalsRows},layout:{hLineColor:()=>INK,vLineColor:()=>'#fff',hLineWidth:(i)=>i===0?0.75:(i===totalsRows.length-1?0.75:0),vLineWidth:()=>0,paddingTop:()=>4,paddingBottom:()=>4,paddingLeft:()=>0,paddingRight:()=>0}}], margin:[0,10,0,12] });
  if(proposal) content.push(...sectionBlocks(secMap.slice(5)));
  // notes
  const note=(title,body)=>({ table:{widths:['*'],body:[[{stack:[{text:title,bold:true,fontSize:10,margin:[0,0,0,6]},{text:body,fontSize:10,lineHeight:1.35}],margin:[4,3,4,3]}]]}, layout:RULE, margin:[0,0,0,10] });
  if(d.terms) content.push(note(proposal?'Commercial notes':'Payment terms',d.terms));
  if(!proposal&&d.paymentInstructions) content.push(note('Payment instructions',d.paymentInstructions));
  if(d.notes) content.push(note('Notes',d.notes));
  return {
    pageSize:'LETTER', pageMargins:[40,42,40,64],
    defaultStyle:{ font:FONT, fontSize:10, color:INK, lineHeight:1.15 },
    info:{ title:label+' '+(s.number||'draft') },
    content,
    footer:(cp,pc)=>({ margin:[40,8,40,0], table:{widths:['auto','*','auto'],body:[[
      (LOGO_SVG?{svg:LOGO_SVG,width:40}:{text:'MODE MODE',bold:true,fontSize:8}),
      {text:d.title,fontSize:8,alignment:'center',color:'#333'},
      {text:(s.number||'DRAFT')+'  /  '+cp+' of '+pc,fontSize:8,alignment:'right'}
    ]]}, layout:{hLineColor:()=>INK,vLineColor:()=>INK,hLineWidth:(i,n)=>i===0?0.75:0,vLineWidth:(i,n)=>(i===0||i===n.table.widths.length)?0.75:0.75,paddingLeft:()=>9,paddingRight:()=>9,paddingTop:()=>7,paddingBottom:()=>7} })
  };
}
const pdfDoc=s=> (FONT==='Strata'&&FONTVFS) ? pdfMake.createPdf(pdfDef(s),null,FONTDEF,FONTVFS) : pdfMake.createPdf(pdfDef(s));
const pdfBlob=s=>new Promise(res=>pdfDoc(s).getBlob(res));
const pdfDataUrl=s=>new Promise(res=>pdfDoc(s).getDataUrl(res));

/* ================= Supabase data layer + ported server logic (api) ============= */
const T={ meta:'studio_meta', clients:'studio_clients', projects:'studio_projects', documents:'studio_documents', payments:'studio_payments', events:'studio_events' };
async function getSettings(){ const { data,error }=await sb.from(T.meta).select('value').eq('key','settings').maybeSingle(); if(error) throw new Error(error.message); return (data&&data.value)||{}; }
function paymentsFor(all,docId){ return all.filter(p=>p.document_id===docId).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))); }
function viewDoc(row,payments){
  const totals=totalItems(row.data.items,row.data.tax);
  const paidCents=payments.filter(p=>!p.reversed_at).reduce((s,p)=>s+p.amount_cents,0);
  const balanceCents=totals.totalCents-paidCents;
  let displayStatus=row.status;
  if(row.kind==='invoice'&&row.status==='issued') displayStatus=balanceCents===0?'paid':(paidCents?'part paid':(row.data.dueDate&&row.data.dueDate<V.today()?'overdue':'issued'));
  const {removedAt=null,versions=[],changes=[]}=row.data._studio||{};
  return { id:row.id,projectId:row.project_id,kind:row.kind,status:row.status,displayStatus:removedAt?'removed':displayStatus,number:row.number,revision:row.revision,data:row.data,snapshot:row.snapshot,sourceId:row.source_id,issuedAt:row.issued_at,createdAt:row.created_at,updatedAt:row.updated_at,pdfPath:row.pdf_path,pdfHash:row.pdf_hash,totals,paidCents,balanceCents,payments,removedAt,versions,changes };
}
async function getDocRow(id){ const { data,error }=await sb.from(T.documents).select('*').eq('id',id).maybeSingle(); if(error) throw new Error(error.message); if(!data) throw new Error('Document not found.'); return data; }
async function ev(docId,type,data={}){ await sb.from(T.events).insert({document_id:docId||null,type,data}); }
async function buildSnapshot(row,number){
  const [{data:proj},settings]=await Promise.all([ sb.from(T.projects).select('*').eq('id',row.project_id).single(), getSettings() ]);
  if(!proj) throw new Error('Project is missing.');
  const { data:cl }=await sb.from(T.clients).select('*').eq('id',proj.client_id).single();
  if(!cl) throw new Error('Client is missing.');
  const { internalNotes, _studio, ...data }=row.data;
  return { templateVersion:1, kind:row.kind, number:number??null, company:settings, client:{id:cl.id,...cl.data}, project:{id:proj.id,...proj.data}, data };
}
async function defaultDoc(projectId,kind){
  const [{data:proj},s]=await Promise.all([ sb.from(T.projects).select('*').eq('id',projectId).single(), getSettings() ]);
  if(!proj) throw new Error('Choose a valid project.');
  const p={id:proj.id,...proj.data};
  const dt=V.today(); const due=new Date(dt+'T12:00:00Z'); due.setUTCDate(due.getUTCDate()+(s.defaultDueDays||0));
  return V.document({ title:p.name, issueDate:dt, dueDate:due.toISOString().slice(0,10), reference:p.reference, items:[], tax:'0.00', sections:{terms:s.proposalTerms}, terms:kind==='invoice'?s.invoiceTerms:'', paymentInstructions:kind==='invoice'?s.paymentInstructions:'' }, kind);
}
async function newDocument(projectId,kind,data=null,sourceId=null){
  const value=data?V.document(data,kind):await defaultDoc(projectId,kind);
  const { data:ins,error }=await sb.from(T.documents).insert({ project_id:projectId, kind, data:value, source_id:sourceId }).select('id').single();
  if(error) throw new Error(error.message);
  await ev(ins.id,'created',{sourceId}); return {id:ins.id};
}
async function apiState(){
  const [settings,cl,pr,docs,pays]=await Promise.all([ getSettings(),
    sb.from(T.clients).select('*').order('created_at',{ascending:false}),
    sb.from(T.projects).select('*').order('created_at',{ascending:false}),
    sb.from(T.documents).select('*').order('created_at',{ascending:false}),
    sb.from(T.payments).select('*') ]);
  for(const r of [cl,pr,docs,pays]) if(r.error) throw new Error(r.error.message);
  const payments=pays.data||[];
  const documents=(docs.data||[]).map(r=>viewDoc(r,paymentsFor(payments,r.id)));
  return {
    version:'0.1.0-hosted', settings,
    clients:(cl.data||[]).map(r=>({id:r.id,...r.data})),
    projects:(pr.data||[]).map(r=>({id:r.id,...r.data})),
    documents:documents.filter(d=>!d.removedAt),
    removedDocuments:documents.filter(d=>d.removedAt),
    today:V.today()
  };
}
function requireRevision(row,payload){ if(payload.revision!==row.revision) throw new Error('This document changed in another tab. Reload before saving or issuing.'); }
// Keep lifecycle history in the existing JSON document; no schema migration is needed.
function studioChange(row,type,extra={}){
  const meta=structuredClone(row.data._studio||{});
  meta.changes=[...(meta.changes||[]),{type,at:new Date().toISOString(),...extra}];
  return meta;
}
async function updateDocument(row,values){
  const {data,error}=await sb.from(T.documents).update({...values,revision:row.revision+1})
    .eq('id',row.id).eq('revision',row.revision).eq('status',row.status).select('id').maybeSingle();
  if(error) throw new Error(error.message);
  if(!data) throw new Error('This document changed in another tab or could not be updated. Reload and try again.');
}

// The ported router. Mirrors server/index.js so the front-end talks to it unchanged.
async function api(path, method='GET', body){
  // ---- reads
  if(method==='GET'){
    if(path==='/api/state') return apiState();
    let m=path.match(/^\/api\/documents\/([a-f0-9-]+)\/events$/);
    if(m){ const { data,error }=await sb.from(T.events).select('*').eq('document_id',m[1]).order('id',{ascending:false}); if(error) throw new Error(error.message); return data||[]; }
    m=path.match(/^\/api\/documents\/([a-f0-9-]+)$/);
    if(m){ const row=await getDocRow(m[1]); const { data:pays }=await sb.from(T.payments).select('*').eq('document_id',row.id); return viewDoc(row,paymentsFor(pays||[],row.id)); }
    throw new Error('Unknown request.');
  }
  // ---- writes
  if(path==='/api/settings'&&method==='PUT'){
    const settings=V.settings(body); if(!settings.studioName) throw new Error('Studio name is required.');
    const { error }=await sb.from(T.meta).upsert({key:'settings',value:settings},{onConflict:'key'}); if(error) throw new Error(error.message);
    await ev(null,'settings-updated'); return {ok:true};
  }
  if(path==='/api/clients'&&method==='POST'){ const c=V.client(body); const { data,error }=await sb.from(T.clients).insert({data:c}).select('id').single(); if(error) throw new Error(error.message); return {id:data.id}; }
  let m=path.match(/^\/api\/clients\/([a-f0-9-]+)$/);
  if(m&&method==='PUT'){ const c=V.client(body); const { error }=await sb.from(T.clients).update({data:c}).eq('id',m[1]); if(error) throw new Error(error.message); return {ok:true}; }
  if(path==='/api/projects'&&method==='POST'){ const p=V.project(body); const { data,error }=await sb.from(T.projects).insert({client_id:p.clientId,data:p}).select('id').single(); if(error) throw new Error(error.message); return {id:data.id}; }
  if(path==='/api/documents'&&method==='POST') return newDocument(body.projectId,body.kind);
  if(path==='/api/demo'&&method==='POST'){
    const c={name:'Example client — DEMO ONLY',contact:'Sample project manager',email:'',address:'Example billing address',notes:'Fictional client for testing. Not a real receivable.'};
    const { data:cIns,error:cErr }=await sb.from(T.clients).insert({data:c}).select('id').single(); if(cErr) throw new Error(cErr.message);
    const p={name:'Exhibition installation / demo',clientId:cIns.id,reference:'DEMO-01',notes:'Fictional test project. Replace or create your own before issuing real documents.'};
    const { data:pIns,error:pErr }=await sb.from(T.projects).insert({client_id:cIns.id,data:p}).select('id').single(); if(pErr) throw new Error(pErr.message);
    const dd=await newDocument(pIns.id,'proposal');
    const row=await getDocRow(dd.id);
    row.data.items=[{description:'Design development and installation drawings',quantity:'1',unit:'day',rate:'1000.00',showRate:true},{description:'Fabrication and preparation',quantity:'2',unit:'days',rate:'650.00',showRate:true},{description:'Installation',quantity:'2',unit:'days',rate:'1000.00',showRate:true},{description:'Materials allowance',quantity:'1',unit:'allowance',rate:'700.00',showRate:false}];
    row.data.sections={overview:'Design, fabricate, and install a mounting structure for an exhibition display.\n\nThis is fictional demonstration content, not a proposal to an actual client.',scope:'Develop an installation approach and dimensioned drawings. Prepare the structure off-site, then complete the installation during an agreed access window.',deliverables:'- Dimensioned installation drawings\n- Fabricated mounting structure\n- Installation and handover',timeline:'Design: schedule to be agreed\nFabrication: following design approval\nInstallation: during the agreed site-access window',assumptions:'- Site conditions and fixing locations to be confirmed.\n- Display equipment and electrical work are excluded.\n- Material allowances require review before issue.',terms:'Add your own approved payment schedule, change procedure, and commercial terms here. This sample does not supply a legal agreement.'};
    await sb.from(T.documents).update({data:row.data}).eq('id',dd.id);
    return dd;
  }
  m=path.match(/^\/api\/documents\/([a-f0-9-]+)(?:\/(\w+))?$/);
  if(m){
    const row=await getDocRow(m[1]); const action=m[2];
    if(row.data._studio?.removedAt&&action!=='restore') throw new Error('Restore this invoice before changing it.');
    if((!action&&method==='DELETE')||(action==='restore'&&method==='POST')){
      requireRevision(row,body);
      if(row.kind!=='invoice') throw new Error('Only invoices can be removed or restored here.');
      const restoring=action==='restore';
      if(restoring&&!row.data._studio?.removedAt) throw new Error('This invoice is not removed.');
      const meta=studioChange(row,restoring?'restored':'removed');
      meta.removedAt=restoring?null:new Date().toISOString();
      await updateDocument(row,{data:{...row.data,_studio:meta}});
      return {id:row.id};
    }
    if(!action&&method==='PUT'){
      requireRevision(row,body);
      const issuedInvoice=row.kind==='invoice'&&row.status==='issued';
      if(row.status!=='draft'&&!issuedInvoice) throw new Error('Only drafts and non-void issued invoices can be edited.');
      const data=V.document(body.data,row.kind);
      if(!issuedInvoice){
        if(row.data._studio)data._studio=structuredClone(row.data._studio);
        await updateDocument(row,{data});
        await ev(row.id,'draft-saved'); return {id:row.id};
      }
      if(body.reviewed!==true) throw new Error('Review the updated invoice before saving.');
      if(!row.snapshot) throw new Error('The issued snapshot is missing. Restore it before editing this invoice.');
      const total=totalItems(data.items,data.tax).totalCents;
      if(!data.items.length||!total||!data.dueDate||!data.paymentInstructions) throw new Error('An issued invoice needs a positive total, a due date, and payment instructions.');
      const {data:pays,error:payError}=await sb.from(T.payments).select('*').eq('document_id',row.id);
      if(payError) throw new Error(payError.message);
      const paid=(pays||[]).filter(p=>!p.reversed_at).reduce((sum,p)=>sum+p.amount_cents,0);
      if(total<paid) throw new Error('The invoice total cannot be less than its recorded payments. Correct the payment records first.');
      const meta=studioChange(row,'invoice-edited');
      meta.versions=[...(meta.versions||[]),{revision:row.revision,savedAt:meta.changes.at(-1).at,snapshot:row.snapshot,pdfPath:row.pdf_path,pdfHash:row.pdf_hash}];
      const {internalNotes,...publicData}=data;
      const snapshot={...row.snapshot,data:publicData};
      // Retain every previous PDF. The revised PDF is generated from its new snapshot.
      await updateDocument(row,{data:{...data,_studio:meta},snapshot,pdf_path:null,pdf_hash:null});
      return {id:row.id};
    }
    if(action==='issue'&&method==='POST'){
      requireRevision(row,body); if(row.status!=='draft') throw new Error('This document has already been issued.');
      if(body.reviewed!==true) throw new Error('Review the document and confirm before issuing.');
      const snap=await buildSnapshot(row); const t=totalItems(row.data.items,row.data.tax);
      if(!snap.company.legalName) throw new Error('Add your legal payee / proprietor identity in Settings before issuing.');
      if(!snap.client.name||!row.data.items.length||!t.totalCents) throw new Error('A bill-to client and a positive fee total are required.');
      if(!row.data.dueDate) throw new Error('Add a due date / valid-until date before issuing.');
      if(row.kind==='invoice'&&!row.data.paymentInstructions) throw new Error('Add payment instructions (or say that they are supplied separately).');
      if(row.kind==='proposal'&&!row.data.sections.scope) throw new Error('Add the proposal scope before issuing.');
      const year=row.data.issueDate.slice(0,4);
      const { data:seq,error:seqErr }=await sb.rpc('studio_next_number',{p_kind:row.kind,p_year:year});
      if(seqErr) throw new Error(seqErr.message);
      const number=(row.kind==='invoice'?snap.company.invoicePrefix:snap.company.proposalPrefix)+'-'+year+'-'+String(seq).padStart(3,'0');
      snap.number=number;
      let pdf_path=null, pdf_hash=null;
      try{ const blob=await pdfBlob(snap); const buf=await blob.arrayBuffer(); pdf_hash=await sha256Hex(buf);
        pdf_path=number+'.pdf'; const { error:upErr }=await sb.storage.from('studio-pdfs').upload(pdf_path,blob,{contentType:'application/pdf',upsert:true}); if(upErr) throw upErr;
      }catch(e){ /* keep issuing even if storage write fails; PDF is regenerable from the frozen snapshot */ pdf_path=null; }
      await updateDocument(row,{status:'issued',number,snapshot:snap,pdf_path,pdf_hash,issued_at:new Date().toISOString()});
      await ev(row.id,'issued',{number,pdfHash:pdf_hash}); return {id:row.id,number};
    }
    if(action==='sent'&&method==='POST'){ if(!['issued','accepted','declined'].includes(row.status)) throw new Error('Only an issued document can be marked as sent.'); await ev(row.id,'sent-manually',{note:V.text(body.note,1000)}); return {ok:true}; }
    if(['accept','decline'].includes(action)&&method==='POST'){
      if(row.kind!=='proposal'||row.status!=='issued') throw new Error('Only an issued, undecided proposal can be marked accepted or declined.');
      const note=V.text(body.note,2000); if(!note) throw new Error('Record the client confirmation or decision reference.');
      await updateDocument(row,{status:action==='accept'?'accepted':'declined'});
      await ev(row.id,action==='accept'?'accepted-manually':'declined-manually',{note}); return {ok:true};
    }
    if(action==='void'&&method==='POST'){
      if(row.status==='draft'||row.status==='void') throw new Error('Only a non-void issued document can be voided.');
      const { data:pays,error:payError }=await sb.from(T.payments).select('*').eq('document_id',row.id);
      if(payError) throw new Error(payError.message);
      if(paymentsFor(pays||[],row.id).filter(p=>!p.reversed_at).reduce((s,p)=>s+p.amount_cents,0)>0) throw new Error('This invoice has recorded payments. Resolve/reverse the records before voiding. This app does not issue refunds.');
      const reason=V.text(body.reason,2000); if(!reason) throw new Error('A reason is required.');
      await updateDocument(row,{status:'void'});
      await ev(row.id,'voided',{reason}); return {ok:true};
    }
    if(action==='clone'&&method==='POST'){ const data=structuredClone(row.data); data.issueDate=V.today(); data.dueDate=''; return newDocument(row.project_id,row.kind,data,row.id); }
    if(action==='convert'&&method==='POST'){
      if(row.kind!=='proposal'||row.status!=='accepted') throw new Error('Record acceptance before making an invoice from a proposal.');
      const { data:ex }=await sb.from(T.documents).select('id').eq('source_id',row.id).eq('kind','invoice').neq('status','void').maybeSingle();
      if(ex) throw new Error('An invoice is already linked to this proposal. Open or restore that invoice rather than duplicating the billing.');
      const s=await getSettings(); const dd=structuredClone(row.data); dd.issueDate=V.today(); dd.dueDate=''; dd.sections={}; dd.terms=s.invoiceTerms; dd.paymentInstructions=s.paymentInstructions; dd.notes='From proposal '+row.number+'.';
      return newDocument(row.project_id,'invoice',dd,row.id);
    }
    if(action==='payments'&&method==='POST'){
      if(row.kind!=='invoice'||row.status!=='issued') throw new Error('Payments require a non-void issued invoice.');
      const key=V.text(body.paymentId,80); if(!/^[a-f0-9-]{36}$/.test(key)) throw new Error('A payment request ID is required.');
      const amount=decimal(body.amount,2,'Payment'), paidOn=V.date(body.paidOn), pmethod=V.text(body.method,100), reference=V.text(body.reference,500);
      const { data:old }=await sb.from(T.payments).select('*').eq('id',key).maybeSingle();
      if(old){ if(old.document_id===row.id&&old.amount_cents===amount) return {ok:true}; throw new Error('Payment request ID has already been used.'); }
      if(paidOn>V.today()) throw new Error('Payment date cannot be in the future.');
      const { data:pays }=await sb.from(T.payments).select('*').eq('document_id',row.id);
      const bal=viewDoc(row,paymentsFor(pays||[],row.id)).balanceCents;
      if(!amount||amount>bal) throw new Error('Payment must be greater than zero and no more than the remaining balance.');
      const { error }=await sb.from(T.payments).insert({id:key,document_id:row.id,amount_cents:amount,paid_on:paidOn,method:pmethod,reference}); if(error) throw new Error(error.message);
      await ev(row.id,'payment-recorded',{paymentId:key,amountCents:amount,paidOn}); return {ok:true};
    }
  }
  m=path.match(/^\/api\/payments\/([a-f0-9-]+)\/reverse$/);
  if(m&&method==='POST'){
    const { data:p }=await sb.from(T.payments).select('*').eq('id',m[1]).maybeSingle();
    if(!p||p.reversed_at) throw new Error('Payment is missing or already reversed.');
    const invoice=await getDocRow(p.document_id);
    if(invoice.data._studio?.removedAt) throw new Error('Restore this invoice before changing its payment records.');
    const reason=V.text(body.reason,1000); if(!reason) throw new Error('A correction reason is required.');
    const { error }=await sb.from(T.payments).update({reversed_at:new Date().toISOString(),reversal_reason:reason}).eq('id',p.id); if(error) throw new Error(error.message);
    await ev(p.document_id,'payment-record-reversed',{paymentId:p.id,reason}); return {ok:true};
  }
  throw new Error('Unknown action.');
}

async function renderSourceFor(doc){
  if(doc.status!=='draft'&&doc.snapshot) return doc.snapshot;
  const settings=state.settings;
  const client=doc.snapshot?.client||clientFor(doc)||{};
  return { kind:doc.kind, number:doc.number||null, company:settings, client, data:doc.data };
}
async function renderPreview(doc){ const iframe=$('#doc-preview'); if(!iframe) return; try{ const url=await pdfDataUrl(await renderSourceFor(doc)); iframe.src=url; }catch(e){ /* ignore preview errors */ } }
async function downloadPdf(doc){ const src=await renderSourceFor(doc); const name=(doc.number||('DRAFT-'+doc.kind))+'.pdf'; pdfDoc(src).download(name); }
async function downloadOriginal(doc){
  if(doc.pdfPath){ try{ const { data,error }=await sb.storage.from('studio-pdfs').createSignedUrl(doc.pdfPath,120); if(!error&&data?.signedUrl){ window.open(data.signedUrl,'_blank'); return; } }catch(e){} }
  return downloadPdf(doc); // fall back to regenerating from the frozen snapshot
}
async function exportJson(){
  const [cl,pr,docs,pays,evs]=await Promise.all([ sb.from(T.clients).select('*'),sb.from(T.projects).select('*'),sb.from(T.documents).select('*'),sb.from(T.payments).select('*'),sb.from(T.events).select('*') ]);
  const out={ schemaVersion:1, exportedAt:new Date().toISOString(), settings:state.settings, clients:cl.data,projects:pr.data,documents:docs.data,payments:pays.data,events:evs.data };
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mode-mode-studio-'+V.today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

  <section id="tab-details" class="tab-content" ${activeTab!=='details'?'hidden':''}><div class="panel"><h2 class="panel-title">Document details</h2><label>Project title on PDF<input data-field="title" value="${esc(working.title)}"></label><div class="grid2"><label>Issue date<input type="date" data-field="issueDate" value="${esc(working.issueDate)}"></label><label>${proposal?'Valid until':'Due date'}<input type="date" data-field="dueDate" value="${esc(working.dueDate)}"></label></div><label>PO / reference<input data-field="reference" value="${esc(working.reference)}"></label><label>${proposal?'Commercial notes':'Payment terms'}<textarea data-field="terms" rows="4">${esc(working.terms)}</textarea></label>${!proposal?`<label>Payment instructions<textarea data-field="paymentInstructions" rows="4" placeholder="Payment details supplied separately, or your approved remittance instructions.">${esc(working.paymentInstructions)}</textarea></label>`:''}<label>Additional client-facing notes<textarea data-field="notes" rows="4">${esc(working.notes)}</textarea></label></div></section>
  <section id="tab-private" class="tab-content" ${activeTab!=='private'?'hidden':''}><div class="panel"><h2 class="panel-title">Internal only</h2><label>Private project / pricing notes<textarea data-field="internalNotes" rows="10" placeholder="Never included in the client-facing PDF.">${esc(working.internalNotes)}</textarea></label><p class="help">Private notes are saved in the database and included in your JSON exports. Do not send a data export to a client.</p></div></section>`:
  `<section id="tab-record" class="tab-content" ${activeTab!=='record'?'hidden':''}><div class="issued-summary"><div class="panel-title">${proposal?'Proposal record':'Invoice & balance'}</div><div class="total-row"><span>${proposal?'Proposed fee':'Invoice total'}</span><strong>${usd(d.totals.totalCents)}</strong></div>${!proposal?`<div class="total-row"><span>Payments recorded</span><span>${usd(d.paidCents)}</span></div><div class="total-row grand"><span>Balance due</span><strong>${usd(d.balanceCents)}</strong></div>`:''}<p class="help" style="margin:16px 0 0">${proposal?'The original PDF never changes after issue. Acceptance is recorded manually, not electronically signed.':'Editing updates the current PDF and keeps the previous version in Activity. Recorded payments remain in the ledger.'}</p></div><div class="panel"><div class="actions">${!removed&&d.status!=='draft'&&d.status!=='void'?btn('Record sent','sent','quiet'):''}${proposal&&d.status==='issued'?btn('Record acceptance','accept','primary')+btn('Record decline','decline','quiet'):''}${proposal&&d.status==='accepted'?btn('Create invoice draft','convert','primary'):''}${!removed&&!proposal&&d.status==='issued'&&d.balanceCents>0?btn('+ Record payment','payment','primary'):''}${!removed&&d.status!=='draft'&&d.status!=='void'?btn('Void record','void','quiet danger'):''}</div>${d.sourceId?`<p class="help" style="margin-top:16px"><a href="#document/${d.sourceId}" class="pill-link">Open source document ↗</a></p>`:''}</div>${!proposal?`<section class="panel"><h2 class="panel-title">Payment ledger</h2>${d.payments.length?d.payments.map(p=>`<div class="ledger-row ${p.reversed_at?'reversed':''}"><div><strong>${usd(p.amount_cents)}</strong><small>${esc(p.paid_on)} / ${esc(p.method||'Manual payment')}</small><small>${esc(p.reference)}${p.reversed_at?'<br>Reversed: '+esc(p.reversal_reason):''}</small></div>${!removed&&!p.reversed_at?btn('Correct record','reverse-payment','mini quiet',`data-id="${p.id}"`):''}</div>`).join(''):'<p class="no-data">No payments recorded.</p>'}</section>`:''}</section>`}
  <section id="tab-activity" class="tab-content" ${activeTab!=='activity'?'hidden':''}><div class="panel"><h2 class="panel-title">Document history</h2><div id="event-list" class="help">Loading history…</div></div></section></div>
  <aside class="preview-panel"><div class="preview-title"><span>${draft?'Layout preview / last saved draft':proposal?'Frozen original / layout preview':'Current invoice / last saved version'}</span><span>US LETTER</span></div><div class="preview-frame"><iframe id="doc-preview" title="Document preview"></iframe></div><p class="help" style="margin-top:12px">The preview is the generated PDF. Download it to check the final page breaks and repeating footer.</p></aside></div>`;
  app.addEventListener('input',editorInput,{signal:editorController.signal});app.addEventListener('change',editorInput,{signal:editorController.signal});
  totals();renderPreview(d);if(activeTab==='activity')loadEvents();
}
let editorController=new AbortController();
function editorInput(e){
  const el=e.target;
  if(el.dataset.field){working[el.dataset.field]=el.value;markDirty();if(el.dataset.field==='tax')totals();}
  if(el.dataset.section){working.sections[el.dataset.section]=el.value;markDirty();}
  if(el.dataset.item){const n=Number(el.closest('[data-row]').dataset.row);working.items[n][el.dataset.item]=el.type==='checkbox'?el.checked:el.value;markDirty();totals();}
}
async function saveDocument(refresh=true,reviewed=false){
  if(!currentDoc||currentDoc.removedAt||!(currentDoc.status==='draft'||editingInvoice))return;
  const issued=currentDoc.status!=='draft';
  await api(`/api/documents/${currentDoc.id}`,'PUT',{revision:currentDoc.revision,data:working,reviewed});dirty=false;editingInvoice=false;await reload();
  currentDoc=await api(`/api/documents/${currentDoc.id}`);
  if(refresh){editorController.abort();editorController=new AbortController();await editor(currentDoc.id);}toast(issued?'Invoice updated. Previous PDF kept in Activity.':'Draft saved.');
}
function modal(title,content,button,handler){
  modalHandler=handler;$('#dialog-content').innerHTML=`<h2>${title}</h2>${content}<div id="modal-error" class="error" role="alert"></div><div class="actions"><button type="button" data-close>Cancel</button><button type="submit" class="primary">${button}</button></div>`;dialog.showModal();
}
$('#dialog-form').addEventListener('submit',async e=>{ e.preventDefault();const button=e.submitter;button.disabled=true;$('#modal-error').textContent='';
  try{await modalHandler(Object.fromEntries(new FormData(e.target)));dialog.close();}catch(error){$('#modal-error').textContent=error.message;}finally{button.disabled=false;} });
dialog.addEventListener('click',e=>{if(e.target.closest('[data-close]'))dialog.close();});
function clientModal(existing){
  const c=existing||{};
  modal(existing?'Client billing details':'New client',`${field('name','Legal / billing name',c.name,'text','required')}${field('contact','Contact person',c.contact)}${field('email','Email',c.email,'email')}${area('address','Billing address',c.address,'',3)}${area('notes','Internal notes',c.notes,'',2)}<p class="help">Editing these details updates drafts only. Issued documents retain their original bill-to details.</p>`,existing?'Save client':'Create client',async data=>{await api('/api/clients'+(existing?'/'+existing.id:''),existing?'PUT':'POST',data);await reload();await render(true);toast('Client saved.');});
}
function projectModal(){
  if(!state.clients.length){toast('Create a client first, then add the project.');clientModal();return;}
  modal('New project',`${field('name','Project name','','text','required')}<label>Client<select name="clientId">${state.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>${field('reference','PO / project reference')}${area('notes','Internal project notes','','',3)}`,'Create project',async data=>{await api('/api/projects','POST',data);await reload();await render(true);toast('Project created.');});
}
function newDocumentModal(kind,projectId){
  if(!state.projects.length){toast('Create a project first.');projectModal();return;}
  modal('New '+kind,`<p>The document will use this project’s client and your current studio defaults.</p><label>Project<select name="projectId">${state.projects.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`,'Create draft',async data=>{const result=await api('/api/documents','POST',{projectId:data.projectId,kind});dirty=false;activeTab='';location.hash='document/'+result.id;});
}
async function safe(fn,button){ if(button)button.disabled=true; try{await fn();}catch(e){toast(e.message,9000);}finally{if(button)button.disabled=false;} }
async function refreshEditor(){dirty=false;await reload();editorController.abort();editorController=new AbortController();await editor(currentDoc.id);}
app.addEventListener('click',async e=>{
  const tabButton=e.target.closest('[data-tab]');if(tabButton){tab(tabButton.dataset.tab);return;}
  const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
  await safe(async()=>{
    if(action==='new-client')return clientModal();
    if(action==='edit-client')return clientModal(state.clients.find(c=>c.id===b.dataset.id));
    if(action==='new-project')return projectModal();
    if(action==='new-document')return newDocumentModal(b.dataset.kind,b.dataset.project);
    if(action==='export-json')return exportJson();
    if(action==='demo'){const d=await api('/api/demo','POST',{});location.hash='document/'+d.id;return;}
    if(action==='add-item'){working.items.push({description:'',quantity:'1',unit:'',rate:'0.00',showRate:true});$('#fees-container').innerHTML=feesMarkup();markDirty();totals();return;}
    if(action==='remove-item'){working.items.splice(Number(b.dataset.index),1);$('#fees-container').innerHTML=feesMarkup();markDirty();totals();return;}
    if(action==='edit-invoice'){editingInvoice=true;activeTab='fees';await refreshEditor();return;}
    if(action==='cancel-edit'){
      if(dirty&&!confirm('Discard your unsaved invoice changes?'))return;
      editingInvoice=false;activeTab='record';await refreshEditor();return;
    }
    if(action==='save'){
      if(!editingInvoice)return saveDocument();
      V.document(working,'invoice');
      modal('Save invoice changes?',`<p>Update <strong>${esc(currentDoc.number)}</strong> and its PDF. Its number and recorded payments stay the same; the previous PDF remains in Activity.</p><p>If you already sent the invoice, share the updated PDF with your client separately.</p>`,'Save changes',async()=>{await saveDocument(true,true);});return;
    }
    if(action==='remove-invoice'){
      const doc=currentDoc;
      modal('Remove this invoice?',`<p><strong>${esc(doc.number||doc.data.title)}</strong> will move to Removed invoices and leave the active lists and outstanding balance. You can restore it later.</p><p>Its payments and PDF history are kept.${dirty?' Unsaved edits will be discarded.':''}</p>`,'Remove invoice',async()=>{await api(`/api/documents/${doc.id}`,'DELETE',{revision:doc.revision});dirty=false;editingInvoice=false;activeTab='';location.hash='invoices';toast('Invoice removed. Find it under Removed to restore it.');});return;
    }
    if(action==='restore-invoice'){
      await api(`/api/documents/${currentDoc.id}/restore`,'POST',{revision:currentDoc.revision});await refreshEditor();toast('Invoice restored.');return;
    }
    if(action==='version-pdf'){
      const v=currentDoc.versions[Number(b.dataset.index)];
      if(v)await downloadOriginal({...currentDoc,snapshot:v.snapshot,pdfPath:v.pdfPath});return;
    }
    if(action==='draft-pdf'){if(dirty)await saveDocument();await downloadPdf(currentDoc);return;}
    if(action==='original-pdf'){await downloadOriginal(currentDoc);return;}
    if(action==='issue'){
      if(dirty)await saveDocument();
      modal('Issue this '+currentDoc.kind+'?',`<p>A unique number will be assigned. The PDF and billing details will be saved. ${currentDoc.kind==='invoice'?'Later invoice edits keep previous versions in Activity.':'The issued proposal remains uneditable.'} <strong>Nothing will be emailed.</strong></p><p>Total: <strong>${usd(currentDoc.totals.totalCents)}</strong></p><label class="checkbox"><input type="checkbox" name="reviewed" required> I have checked the client, legal payee, scope, dates, amounts, tax treatment, and payment instructions.</label>`,'Issue document',async f=>{await api(`/api/documents/${currentDoc.id}/issue`,'POST',{revision:currentDoc.revision,reviewed:f.reviewed==='on'});activeTab='record';await refreshEditor();toast('Document issued. Download and send it separately.');});return;
    }
    if(action==='clone'){const r=await api(`/api/documents/${currentDoc.id}/clone`,'POST',{});activeTab='';location.hash='document/'+r.id;return;}
    if(action==='convert'){
      modal('Create an invoice draft?',`<p>Copy this accepted proposal’s fees into an invoice for the full amount. The invoice remains editable until issued.</p><p>Automated deposit/progress/final reconciliation is not implemented. For staged billing, author separate invoices and review the combined total.</p>`,'Create invoice draft',async()=>{const r=await api(`/api/documents/${currentDoc.id}/convert`,'POST',{});activeTab='';location.hash='document/'+r.id;});return;
    }
    if(['sent','accept','decline'].includes(action)){
      const title=action==='sent'?'Record that you sent it':action==='accept'?'Record client acceptance':'Record client decline';
      modal(title,`<p>${action==='sent'?'This records your own email or delivery; it does not send the document.':'Record a decision received outside the app. This is not an e-signature.'}</p>${area('note','Confirmation / communication reference','','For example: date, contact and email subject.',4)}`,'Save record',async f=>{await api(`/api/documents/${currentDoc.id}/${action}`,'POST',f);await refreshEditor();toast('Record saved.');});return;
    }
    if(action==='void'){
      modal('Void this record?',`<p>The original number and PDF will remain in history. This does not create a credit note, issue a refund, or notify a client.</p>${area('reason','Reason for voiding','','Required',3)}`,'Void record',async f=>{await api(`/api/documents/${currentDoc.id}/void`,'POST',f);await refreshEditor();toast('Record voided.');});return;
    }
    if(action==='payment'){
      const paymentId=crypto.randomUUID();
      modal('Record a payment',`<p>This records money you have already received. It does not move any funds.</p><div class="grid2">${field('amount','Amount (USD)',(currentDoc.balanceCents/100).toFixed(2),'text','inputmode="decimal" required')}${field('paidOn','Received on',state.today,'date','required')}</div>${field('method','Method','','text','placeholder="ACH / check / other"')}${field('reference','Bank or remittance reference')}`,'Record payment',async f=>{await api(`/api/documents/${currentDoc.id}/payments`,'POST',{...f,paymentId});await refreshEditor();toast('Payment recorded. The original PDF is unchanged.');});return;
    }
    if(action==='reverse-payment'){
      modal('Correct a payment record',`<p>Reverse this entry in the ledger. The original entry stays in history. <strong>This does not refund any money.</strong></p>${area('reason','Reason for correction','','Required',3)}`,'Reverse record',async f=>{await api(`/api/payments/${b.dataset.id}/reverse`,'POST',f);await refreshEditor();toast('Payment record reversed.');});return;
    }
  },b);
});
let renderToken=0;
async function render(force=false){
  const route=(location.hash.slice(1)||'dashboard');
  if(dirty&&!force&&route!==lastRoute&&!confirm('You have unsaved changes. Discard them and leave?')){location.hash=lastRoute;return;}
  if(route===lastRoute&&!force&&dirty)return;
  dirty=false;editingInvoice=false;lastRoute=route;const token=++renderToken;
  editorController.abort();editorController=new AbortController();working=null;currentDoc=null;
  try{
    await reload();if(token!==renderToken)return;
    const [page,docId]=route.split('/');$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===page));
    if(page==='document'){await editor(docId);$$('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(currentDoc.kind==='proposal'?'proposals':'invoices')));}
    else if(page==='proposals')documentList('proposal');else if(page==='invoices')documentList('invoice');else if(page==='removed-invoices'){documentList('invoice',true);$('[data-nav="invoices"]').classList.add('active');}else if(page==='clients')clients();else if(page==='projects')projects();else if(page==='settings')settings();else overview();
  }catch(e){app.innerHTML=head('Could not open this view.',esc(e.message))+'<a class="button" href="#dashboard">Back to overview</a>';}
}
window.addEventListener('hashchange',()=>render());
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

/* ================= boot ================= */
await loadFonts();
window.__STUDIO__={ pdfDef, pdfBlob, pdfDataUrl, api, apiState, loadFonts, get font(){return FONT;} };
refreshAuth();
</script>
</body>
